plugins {
    id 'com.android.application'
}

android {
    namespace 'com.signalplay.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.signalplay.mobile"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // App blindado em Java! Zero dependências externas.
}
